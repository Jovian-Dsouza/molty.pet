# Raspberry Pi system-wide playback route for Molty's Bluetooth speaker.
defaults.bluealsa.device "59:E9:75:92:6F:E6"
defaults.bluealsa.profile "a2dp"
defaults.namehint.extended on

pcm.molty_bt {
    type plug
    slave {
        pcm "bluealsa"
        channels 2
        rate 48000
    }
    hint {
        show on
        description "Molty Bluetooth Speaker"
    }
}

pcm.!default {
    type plug
    slave.pcm "molty_bt"
}

ctl.!default {
    type bluealsa
    device "59:E9:75:92:6F:E6"
}
